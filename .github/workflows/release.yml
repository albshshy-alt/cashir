name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone Cashier updater
        run: npm run dist:updater -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Windows installer
        run: npm run dist:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release assets
        shell: bash
        run: |
          ls -lah release release-updater
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "نظام كاشير ${GITHUB_REF_NAME}" --generate-notes --draft
          for asset in release/*.exe release/*.yml release-updater/*.exe; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "${GITHUB_REF_NAME}" "$asset" --repo "${GITHUB_REPOSITORY}" --clobber; then
                break
              fi
              echo "Upload attempt ${attempt} failed for ${asset}; retrying..."
              sleep 15
            done
          done
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "نظام كاشير ${GITHUB_REF_NAME}" \
            --draft=false --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
